<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deity Relationships — 3D Alignment Map</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; font-family: sans-serif; }
  #plot { width: 100%; height: 100vh; }
</style>
</head>
<body>
<div id="plot"></div>
<script>
// ============================================================
// DEITY DATA
// ============================================================
// x = Lawful (-1) to Chaotic (+1)
// y = Evil (-1) to Good (+1)
// z = Obelisk (-1) / Both (0) / Party (1)

const deities = [
  { name: "Mask",      alignment: "Chaotic Neutral",  x: 1,  y: 0,  z: 1,  pantheon: "Party"   },
  { name: "Silvanus",  alignment: "True Neutral",     x: 0,  y: 0,  z: 0,  pantheon: "Both"    },
  { name: "Ilmater",   alignment: "Lawful Good",      x: -1, y: 1,  z: 0,  pantheon: "Both"    },
  { name: "Selûne",    alignment: "Chaotic Good",     x: 1,  y: 1,  z: 0,  pantheon: "Both"    },
  { name: "Sune",      alignment: "Chaotic Good",     x: 1,  y: 1,  z: 0,  pantheon: "Both"    },
  { name: "Azuth",     alignment: "Lawful Neutral",   x: -1, y: 0,  z: 0,  pantheon: "Both"    },
  { name: "Waukeen",   alignment: "Neutral",          x: 0,  y: 0,  z: 1,  pantheon: "Party"   },
  { name: "Grolantor", alignment: "Chaotic Evil",     x: 1,  y: -1, z: 1,  pantheon: "Party"   },
  { name: "Tyr",       alignment: "Lawful Good",      x: -1, y: 1,  z: -1, pantheon: "Obelisk" },
  { name: "Mystra",    alignment: "Neutral Good",     x: 0,  y: 1,  z: -1, pantheon: "Obelisk" },
  { name: "Bane",      alignment: "Lawful Evil",      x: -1, y: -1, z: -1, pantheon: "Obelisk" },
  { name: "Gilean",    alignment: "True Neutral",     x: 0,  y: 0,  z: -1, pantheon: "Obelisk" },
  { name: "Tempus",    alignment: "True Neutral",     x: 0,  y: 0,  z: -1, pantheon: "Obelisk" }
];

const labelOffsets = {
  "Mask":      { dx: 0.30,  dy: -0.25 },
  "Silvanus":  { dx: -0.35, dy: 0.25  },
  "Ilmater":   { dx: -0.35, dy: 0.25  },
  "Selûne":    { dx: -0.35, dy: 0.25  },
  "Sune":      { dx: 0.35,  dy: -0.25 },
  "Azuth":     { dx: -0.35, dy: -0.25 },
  "Waukeen":   { dx: 0.35,  dy: -0.25 },
  "Grolantor": { dx: -0.35, dy: 0.25  },
  "Tyr":       { dx: 0.35,  dy: -0.25 },
  "Mystra":    { dx: 0,     dy: 0.25  },
  "Bane":      { dx: -0.35, dy: -0.25 },
  "Gilean":    { dx: -0.35, dy: -0.25 },
  "Tempus":    { dx: 0.35,  dy: 0.25  }
};

const pantheonColors = { Party: "teal", Both: "orange", Obelisk: "dodgerblue" };
const relationshipColors = { ally: "forestgreen", enemy: "firebrick", frenemy: "purple" };

// ============================================================
// RELATIONSHIPS
// ============================================================
const relationships = [
  { from: "Mask", to: "Waukeen",   type: "enemy" },
  { from: "Mask", to: "Tyr",       type: "enemy" },
  { from: "Mask", to: "Ilmater",   type: "enemy" },
  { from: "Silvanus", to: "Grolantor", type: "enemy" },
  { from: "Ilmater", to: "Tyr",    type: "ally"  },
  { from: "Ilmater", to: "Azuth",  type: "ally"  },
  { from: "Ilmater", to: "Selûne", type: "ally"  },
  { from: "Ilmater", to: "Mask",   type: "enemy" },
  { from: "Selûne", to: "Mystra",  type: "ally"  },
  { from: "Selûne", to: "Mask",    type: "enemy" },
  { from: "Selûne", to: "Ilmater", type: "ally"  },
  { from: "Selûne", to: "Silvanus",type: "ally"  },
  { from: "Selûne", to: "Sune",    type: "ally"  },
  { from: "Sune", to: "Selûne",    type: "ally"  },
  { from: "Sune", to: "Waukeen",   type: "ally"  },
  { from: "Azuth", to: "Mystra",   type: "ally"  },
  { from: "Azuth", to: "Ilmater",  type: "ally"  },
  { from: "Azuth", to: "Bane",     type: "enemy" },
  { from: "Waukeen", to: "Silvanus", type: "enemy" },
  { from: "Waukeen", to: "Grolantor",type: "enemy" },
  { from: "Grolantor", to: "Silvanus", type: "enemy" },
  { from: "Grolantor", to: "Mask",   type: "enemy" },
  { from: "Tyr", to: "Mystra",     type: "ally"  },
  { from: "Tyr", to: "Azuth",      type: "ally"  },
  { from: "Mystra", to: "Tyr",     type: "ally"  },
  { from: "Mystra", to: "Ilmater", type: "ally"  },
  { from: "Mystra", to: "Azuth",   type: "ally"  },
  { from: "Mystra", to: "Bane",    type: "enemy" },
  { from: "Mystra", to: "Sune",    type: "ally"  },
  { from: "Mystra", to: "Selûne",  type: "ally"  },
  { from: "Bane", to: "Azuth",     type: "enemy" },
  { from: "Bane", to: "Mystra",    type: "enemy" },
  { from: "Bane", to: "Gilean",    type: "enemy" },
  { from: "Bane", to: "Tempus",    type: "enemy" },
  { from: "Bane", to: "Mask",      type: "frenemy" },
  { from: "Tempus", to: "Sune",    type: "ally"  },
  { from: "Tempus", to: "Selûne",  type: "ally"  },
  { from: "Gilean", to: "Bane",    type: "enemy" }
];

// ============================================================
// BUILD TRACES
// ============================================================

function deityByName(n) { return deities.find(d => d.name === n); }

// Categorize each relationship
function categoryOf(rel) {
  const f = deityByName(rel.from).pantheon;
  const t = deityByName(rel.to).pantheon;
  const party_ok   = (f === "Party" || f === "Both") && (t === "Party" || t === "Both");
  const obelisk_ok = (f === "Obelisk" || f === "Both") && (t === "Obelisk" || t === "Both");
  if (rel.type === "frenemy") return "both";
  if (party_ok && obelisk_ok) return "both";
  if (party_ok) return "party";
  if (obelisk_ok) return "obelisk";
  return "excluded";
}

const traces = [];
const traceMeta = []; // { kind, pantheon, relType } for visibility arrays

// --- Relationship traces (Party, Obelisk, Both; each split by ally/enemy/frenemy) ---
const relBuckets = {
  party:   { ally: [], enemy: [], frenemy: [] },
  obelisk: { ally: [], enemy: [], frenemy: [] },
  both:    { ally: [], enemy: [], frenemy: [] }
};

for (const rel of relationships) {
  const cat = categoryOf(rel);
  if (cat === "excluded") continue;
  const from = deityByName(rel.from);
  const to   = deityByName(rel.to);
  relBuckets[cat][rel.type].push({
    x: [from.x, to.x],
    y: [from.y, to.y],
    z: [from.z, to.z]
  });
}

const catOrder = ["party", "obelisk", "both"];
const relOrder = ["ally", "enemy", "frenemy"];

for (const cat of catOrder) {
  for (const rt of relOrder) {
    const segs = relBuckets[cat][rt];
    const isFirstAlly    = (rt === "ally");
    const isFirstEnemy   = (rt === "enemy");
    const isFrenemyTrace = (rt === "frenemy" && cat === "both"); // one legend owner

    traces.push({
      type: "scatter3d",
      mode: "lines",
      x: segs.flatMap(s => [s.x[0], s.x[1], null]),
      y: segs.flatMap(s => [s.y[0], s.y[1], null]),
      z: segs.flatMap(s => [s.z[0], s.z[1], null]),
      line: { color: relationshipColors[rt], width: 4 },
      opacity: 0.8,
      hoverinfo: "none",
      showlegend: false, // handled by anchors below
      legendgroup: rt,
      name: rt
    });
    traceMeta.push({ kind: "rel", cat: cat, relType: rt });
  }
}

// --- Legend anchor traces (always visible) ---
const anchorOrder = ["ally", "enemy", "frenemy"];
const anchorLabels = { ally: "Allies", enemy: "Foes", frenemy: "Frenemy" };
for (const rt of anchorOrder) {
  traces.push({
    type: "scatter3d",
    mode: "lines",
    // Tiny segment far off-screen so it draws a legend swatch
    // but is never visible in the scene.
    x: [-999, -998],
    y: [-999, -998],
    z: [-999, -998],
    line: { color: relationshipColors[rt], width: 4 },
    showlegend: true,
    name: anchorLabels[rt],
    legendgroup: "anchor_" + rt,
    hoverinfo: "none"
  });
  traceMeta.push({ kind: "anchor", relType: rt });
}

// --- Deity markers ---
for (const p of ["Party", "Both", "Obelisk"]) {
  const subset = deities.filter(d => d.pantheon === p);
  traces.push({
    type: "scatter3d",
    mode: "markers",
    x: subset.map(d => d.x),
    y: subset.map(d => d.y),
    z: subset.map(d => d.z),
    marker: {
      size: 8,
      color: pantheonColors[p],
      symbol: "circle",
      line: { color: "black", width: 1 }
    },
    text: subset.map(d => `<b>${d.name}</b><br>Alignment: ${d.alignment}<br>Pantheon: ${d.pantheon}`),
    hoverinfo: "text",
    showlegend: true,
    name: p === "Both" ? "Shared Gods" : p + " Gods",
    legendgroup: "gods_" + p
  });
  traceMeta.push({ kind: "gods", pantheon: p });
}

// --- Deity labels ---
for (const p of ["Party", "Both", "Obelisk"]) {
  const subset = deities.filter(d => d.pantheon === p);
  traces.push({
    type: "scatter3d",
    mode: "text",
    x: subset.map(d => d.x + (labelOffsets[d.name]?.dx || 0)),
    y: subset.map(d => d.y + (labelOffsets[d.name]?.dy || 0)),
    z: subset.map(d => d.z),
    text: subset.map(d => d.name),
    textfont: { size: 12, color: pantheonColors[p] },
    textposition: "top center",
    hoverinfo: "none",
    showlegend: false
  });
  traceMeta.push({ kind: "labels", pantheon: p });
}

// ============================================================
// VISIBILITY ARRAYS
// ============================================================
function buildVisibility(mode) {
  return traceMeta.map(m => {
    if (m.kind === "anchor") return true;
    if (m.kind === "rel") {
  	if (mode === "both")    return true;
 	 // Frenemy lines only show in "Show Both"
 	 if (m.relType === "frenemy") return false;
 	 if (mode === "party")   return m.cat !== "obelisk";
 	 if (mode === "obelisk") return m.cat !== "party";
	}
    if (m.kind === "gods" || m.kind === "labels") {
      if (mode === "both")    return true;
      if (mode === "party")   return m.pantheon !== "Obelisk";
      if (mode === "obelisk") return m.pantheon !== "Party";
    }
    return true;
  });
}

const visBoth    = buildVisibility("both");
const visParty   = buildVisibility("party");
const visObelisk = buildVisibility("obelisk");

// ============================================================
// LAYOUT
// ============================================================
const layout = {
  title: { text: "Combined Deity Relationships in 3D Space" },
  scene: {
    xaxis: { title: "Lawful ↔ Chaotic", range: [-1.5, 1.5], dtick: 0.5, zeroline: true },
    yaxis: { title: "Evil ↔ Good",      range: [-1.5, 1.5], dtick: 0.5, zeroline: true },
    zaxis: {
      title: "Pantheon",
      range: [-1.5, 1.5],
      ticktext: ["Obelisk", "Both", "Party"],
      tickvals: [-1, 0, 1]
    },
    aspectmode: "manual",
    aspectratio: { x: 1, y: 1, z: 1 },
    camera: { eye: { x: 2, y: 2, z: 2 } }
  },
  legend: {
    title: { text: "Legend" },
    itemsizing: "constant",
    x: 1.02, xanchor: "left",
    y: 1,    yanchor: "top"
  },
  margin: { l: 50, r: 180, b: 50, t: 70 },
  updatemenus: [{
    type: "buttons",
    direction: "down",
    x: 1.02, xanchor: "left",
    y: 0.02, yanchor: "bottom",
    buttons: [
      { method: "restyle", args: ["visible", visBoth],    label: "Show Both" },
      { method: "restyle", args: ["visible", visParty],   label: "Show Party Only" },
      { method: "restyle", args: ["visible", visObelisk], label: "Show Obelisk Only" }
    ]
  }]
};

console.log("Traces:", traces.length);
console.log("visBoth:", visBoth.length);
console.log("visParty:", visParty.length);
console.log("visObelisk:", visObelisk.length);

Plotly.newPlot("plot", traces, layout, { responsive: true });
</script>
</body>
</html>
