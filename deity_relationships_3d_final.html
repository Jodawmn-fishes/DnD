<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deity Relationships — 3D Alignment Map</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #fff; font-family: sans-serif;
    overflow: hidden;
  }

  #container {
    display: flex;
    height: 100vh;
    position: relative;
  }

  #plot {
    flex: 0 0 60%; /* Increased width so 3D graph appears larger */
    min-width: 0;
    position: relative;
  }

  #controls {
    position: absolute;
    top: 220px; /* Moves controls directly below the legend on the right */
    right: 20px;
    z-index: 10;
    display: flex;
    flex-direction: column; /* Stacked buttons vertically for neat legend alignment */
    gap: 8px;
  }

  #controls button {
    padding: 8px 14px;
    border: 1px solid #999;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
  }

  #controls button.active {
    background: #333;
    color: #fff;
    border-color: #333;
  }

  #sidePanel {
    flex: 0 0 40%; /* Decreased 2D graph area so both graphs appear similar size */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    border-right: 1px solid #ddd;
    background: #fafafa;
  }

  #sideImageContainer {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #sidePanel img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 4px;
  }

  #sidePanel .empty-state {
    color: #888;
    font-size: 14px;
    text-align: center;
    padding: 24px;
    line-height: 1.5;
  }

  /* Mobile Responsive Formatting */
  @media (max-width: 768px) {
    html, body {
      overflow: auto; /* Allows scrolling on mobile */
    }
    #container { 
      flex-direction: column; 
      height: auto;
      min-height: 100vh;
    }
    #plot, #sidePanel {
      flex: 0 0 auto;
      width: 100%;
    }
    #plot { 
      height: 500px; 
    }
    #sidePanel { 
      height: 400px; 
      border-right: none; 
      border-top: 1px solid #ddd; 
    }
    #controls {
      top: 10px;
      right: 10px;
      flex-direction: row; /* Horizontal button layout on mobile screens */
    }
  }
</style>
</head>
<body>
<div id="container">
  <div id="sidePanel">
    <div id="sideImageContainer">
      <div class="empty-state">Loading reference chart…</div>
    </div>
  </div>
  <div id="plot">
    <div id="controls">
      <button data-view="both" class="active">Show Both</button>
      <button data-view="party">Show Party Only</button>
      <button data-view="obelisk">Show Obelisk Only</button>
    </div>
  </div>
</div>

// BUILD TRACES
// ============================================================
function deityByName(n) { return deities.find(d => d.name === n); }

function categoryOf(rel) {
  const f = deityByName(rel.from).pantheon;
  const t = deityByName(rel.to).pantheon;
  const party_ok   = (f === "Party" || f === "Both") && (t === "Party" || t === "Both");
  const obelisk_ok = (f === "Obelisk" || f === "Both") && (t === "Obelisk" || t === "Both");
  if (rel.type === "frenemy") return "both";
  if (party_ok && obelisk_ok) return "both";
  if (party_ok) return "party";
  if (obelisk_ok) return "obelisk";
  return "excluded";
}

const traces = [];
const traceMeta = [];

const relBuckets = {
  party:   { ally: [], enemy: [], frenemy: [] },
  obelisk: { ally: [], enemy: [], frenemy: [] },
  both:    { ally: [], enemy: [], frenemy: [] }
};

for (const rel of relationships) {
  const cat = categoryOf(rel);
  if (cat === "excluded") continue;
  const from = deityByName(rel.from);
  const to   = deityByName(rel.to);
  relBuckets[cat][rel.type].push({
    x: [from.x, to.x],
    y: [from.y, to.y],
    z: [from.z, to.z]
  });
}

const catOrder = ["party", "obelisk", "both"];
const relOrder = ["ally", "enemy", "frenemy"];

for (const cat of catOrder) {
  for (const rt of relOrder) {
    const segs = relBuckets[cat][rt];
    if (segs.length === 0) continue;

    traces.push({
      type: "scatter3d",
      mode: "lines",
      x: segs.flatMap(s => [s.x[0], s.x[1], null]),
      y: segs.flatMap(s => [s.y[0], s.y[1], null]),
      z: segs.flatMap(s => [s.z[0], s.z[1], null]),
      line: { color: relationshipColors[rt], width: 4 },
      opacity: 0.8,
      hoverinfo: "none",
      showlegend: false,
      legendgroup: rt,
      name: rt
    });
    traceMeta.push({ kind: "rel", cat: cat, relType: rt });
  }
}

// Legend anchor traces
const anchorOrder = ["ally", "enemy", "frenemy"];
const anchorLabels = { ally: "Allies", enemy: "Foes", frenemy: "Frenemy" };
for (const rt of anchorOrder) {
  traces.push({
    type: "scatter3d",
    mode: "lines",
    x: [-999, -998],
    y: [-999, -998],
    z: [-999, -998],
    line: { color: relationshipColors[rt], width: 4 },
    showlegend: true,
    name: anchorLabels[rt],
    legendgroup: "anchor_" + rt,
    hoverinfo: "none"
  });
  traceMeta.push({ kind: "anchor", relType: rt });
}

// Deity markers
for (const p of ["Party", "Both", "Obelisk"]) {
  const subset = deities.filter(d => d.pantheon === p);
  traces.push({
    type: "scatter3d",
    mode: "markers",
    x: subset.map(d => d.x),
    y: subset.map(d => d.y),
    z: subset.map(d => d.z),
    marker: {
      size: 15,
      color: pantheonColors[p],
      symbol: "circle",
      line: { color: "black", width: 2 }
    },
    text: subset.map(d => `<b>${d.name}</b><br>Alignment: ${d.alignment}<br>Pantheon: ${d.pantheon}`),
    hoverinfo: "text",
    showlegend: true,
    name: p === "Both" ? "Shared Gods" : p + " Gods",
    legendgroup: "gods_" + p
  });
  traceMeta.push({ kind: "gods", pantheon: p });
}

// Deity labels
for (const p of ["Party", "Both", "Obelisk"]) {
  const subset = deities.filter(d => d.pantheon === p);
  traces.push({
    type: "scatter3d",
    mode: "text",
    x: subset.map(d => d.x + (labelOffsets[d.name]?.dx || 0)),
    y: subset.map(d => d.y + (labelOffsets[d.name]?.dy || 0)),
    z: subset.map(d => d.z),
    text: subset.map(d => d.name),
    textfont: { size: 14, color: pantheonColors[p] },
    textposition: "top center",
    hoverinfo: "none",
    showlegend: false
  });
  traceMeta.push({ kind: "labels", pantheon: p });
}

// ============================================================
// VISIBILITY ARRAYS
// ============================================================
function buildVisibility(mode) {
  return traceMeta.map(m => {
    if (m.kind === "anchor") return true;
    if (m.kind === "rel") {
      if (mode === "both") return true;
      if (m.relType === "frenemy") return false;
      if (mode === "party")   return m.cat !== "obelisk";
      if (mode === "obelisk") return m.cat !== "party";
    }
    if (m.kind === "gods" || m.kind === "labels") {
      if (mode === "both")    return true;
      if (mode === "party")   return m.pantheon !== "Obelisk";
      if (mode === "obelisk") return m.pantheon !== "Party";
    }
    return true;
  });
}

const visBoth    = buildVisibility("both");
const visParty   = buildVisibility("party");
const visObelisk = buildVisibility("obelisk");

const visMap = {
  both:    visBoth,
  party:   visParty,
  obelisk: visObelisk
};

// ============================================================
// LAYOUT
// ============================================================
const layout = {
  title: { text: "Combined Deity Relationships in 3D Space" },
  scene: {
    xaxis: { title: "Lawful ↔ Chaotic", range: [-1.5, 1.5], dtick: 0.5, zeroline: true },
    yaxis: { title: "Evil ↔ Good",      range: [-1.5, 1.5], dtick: 0.5, zeroline: true },
    zaxis: {
      title: "Pantheon",
      range: [-1.5, 1.5],
      ticktext: ["Obelisk", "Both", "Party"],
      tickvals: [-1, 0, 1]
    },
    aspectmode: "manual",
    aspectratio: { x: 1, y: 1, z: 1 },
    /* Adjusted z eye to move graph slightly higher in frame */
    camera: { eye: { x: 1.8, y: 1.8, z: 2.3 } } 
  },
  legend: {
    title: { text: "Legend" },
    itemsizing: "constant",
    x: 1.02, xanchor: "left",
    y: 1,    yanchor: "top"
  },
  /* Reduced top margin to shift plot higher up */
  margin: { l: 20, r: 160, b: 20, t: 30 } 
};

Plotly.newPlot("plot", traces, layout, { responsive: true });

// ============================================================
// SIDE IMAGE SWAPPING
// ============================================================
function updateSideImage(view) {
  const container = document.getElementById("sideImageContainer");
  const src = imageMap[view];

  if (!src || src.startsWith("__")) {
    container.innerHTML =
      '<div class="empty-state">Interactive 3D view<br>(no reference chart for this mode)</div>';
    return;
  }

  container.innerHTML = `<img id="sideImage" src="${src}" alt="Reference chart">`;
}

// ============================================================
// BUTTON WIRING
// ============================================================
document.querySelectorAll("#controls button").forEach(btn => {
  btn.addEventListener("click", () => {
    const view = btn.dataset.view;

    Plotly.update("plot", { visible: visMap[view] }, {});
    updateSideImage(view);

    document.querySelectorAll("#controls button")
      .forEach(b => b.classList.toggle("active", b === btn));
  });
});

updateSideImage("both");
</script>
</body>
</html>
